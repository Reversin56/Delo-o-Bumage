<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15110c">
<title>ДЕЛО О БУМАГЕ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --night:#15110c; --night2:#1f1811; --lamp:#f2c964; --lampdim:#9a7c3c;
  --paper:#eee5cd; --paper2:#d6cbae; --ink:#1b1710; --blood:#b02a1a;
  --wood:#4a3b28; --fence:#6b7a5a; --dust:#a09786;
  --disp:'Arial Narrow','Helvetica Neue Condensed',Arial,sans-serif;
  --body:Georgia,'Times New Roman',serif;
  --mono:'Courier New',Courier,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.scr{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100dvh);display:none;
  flex-direction:column;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.scr.on{display:flex}

/* МЕНЮ */
#menu{background:#15110c}
#menu::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:url('bg/menu.webp');background-size:cover;background-position:center 42%;
  animation:drift 34s ease-in-out infinite alternate}
#menu::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,rgba(21,17,12,.30),rgba(21,17,12,.80) 68%),
             linear-gradient(rgba(21,17,12,.55),transparent 26%,transparent 58%,rgba(21,17,12,.92))}
@keyframes drift{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.13) translate(-1.5%,-1.2%)}}
#menu .tt,#menu .tape{position:relative;z-index:2}
.tt{font-family:var(--disp);font-weight:700;text-transform:uppercase;text-align:center;line-height:.86;
  color:var(--paper);letter-spacing:.01em;transform:rotate(-.8deg);
  text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 46px rgba(0,0,0,.9),0 0 90px rgba(0,0,0,.7)}
.tt .b{display:block;font-size:clamp(46px,13.5vw,150px)}
.tt .r{display:block;color:var(--blood);font-size:clamp(46px,13.5vw,150px)}
.tt .s{display:block;font-family:var(--mono);font-size:clamp(11px,2.4vw,15px);letter-spacing:.44em;
  color:var(--lampdim);margin-top:1.1em;text-transform:uppercase}
.tape{margin-top:clamp(26px,5.5vh,58px);background:var(--lamp);color:var(--ink);
  padding:17px 44px;font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(19px,3.6vw,27px);letter-spacing:.2em;transform:rotate(-1.2deg);
  box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .15s,filter .15s}
.tape:hover,.tape:focus-visible{transform:rotate(-1.2deg) translateY(-3px);filter:brightness(1.08)}

/* ВСТУПЛЕНИЕ */
#intro{background:#07080a;justify-content:flex-start;overflow:hidden;padding:0;
  perspective:2000px;perspective-origin:50% 0%}
#intro::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(rgba(7,8,10,.94) 0%,rgba(7,8,10,.28) 8%,transparent 17%)}
#prelude{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
  width:min(760px,88%);text-align:center;pointer-events:none;
  font-family:var(--body);font-size:clamp(17px,3vw,27px);line-height:1.5;
  color:#4bd5ee;letter-spacing:.02em;opacity:0;
  animation:prel 5.6s ease forwards}
@keyframes prel{0%{opacity:0}15%{opacity:1}86%{opacity:1}100%{opacity:0}}
.iw{position:absolute;left:50%;width:100%;padding:0 clamp(10px,3vw,26px);box-sizing:border-box;
  transform-origin:50% 100%;transform:translateX(-50%) rotateX(6deg);
  animation:crawl 108s linear 5.5s both;text-align:center;
  opacity:0;transition:opacity 1.2s ease}
@keyframes crawl{from{top:var(--from,366%)}to{top:var(--to,-470%)}}
.iw p{font-size:clamp(20px,4.2vw,40px);line-height:1.42;color:#f7d27a;margin-bottom:1.05em;
  font-family:var(--disp);font-weight:700;letter-spacing:.015em;
  text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 26px rgba(240,200,96,.22)}
.iw p.st{text-align:center;letter-spacing:.18em;color:#ffe9b0;font-size:clamp(24px,5.4vw,50px)}
.iw p b{color:#fff3d0}
.iw p em{font-style:normal}
.go{position:relative;border:2px solid var(--lamp);color:var(--lamp);background:rgba(7,8,10,.7);
  font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.3em;
  font-size:clamp(13px,2.2vw,17px);padding:14px 32px;
  opacity:0;pointer-events:none;transition:opacity .9s ease}
.go.on{opacity:1;pointer-events:auto}
.go:hover,.go:focus-visible{background:var(--lamp);color:var(--ink)}
#outro{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(16px,3vh,32px);
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#outro.on{display:flex;animation:outin 1.6s ease forwards}
@keyframes outin{from{opacity:0}to{opacity:1}}
#outroimg{max-width:min(920px,94%);max-height:60vh;width:auto;height:auto;
  box-shadow:0 18px 60px rgba(0,0,0,.75);border:1px solid rgba(240,200,96,.18)}
.go:hover,.go:focus-visible{background:var(--lamp);color:var(--ink)}
@keyframes fi{to{opacity:1;transform:none}}

/* КАРТА УЧАСТКА */
#map{background:#15110c;justify-content:flex-start}
#map::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.34;
  background-image:url('bg/menu.webp');background-size:cover;background-position:center 55%;filter:blur(2px)}
#map::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(21,17,12,.72),rgba(21,17,12,.92))}
#map>*{position:relative;z-index:2}
.mhead{width:100%;max-width:900px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.mday{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(22px,4.4vw,38px);letter-spacing:.05em}
.mday em{font-style:normal;color:var(--lamp)}
.msub{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dust);text-transform:uppercase}
.plot{width:100%;max-width:900px;flex:1;display:grid;gap:10px;min-height:0;
  grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;margin:10px 0}
.loc{position:relative;border:2px solid #3a2f20;background:#1c160f;padding:12px;
  background-size:cover;background-position:center 46%;
  display:flex;flex-direction:column;justify-content:flex-end;gap:6px;overflow:hidden;transition:.18s;text-align:left}
.loc::before{content:'';position:absolute;inset:0;z-index:0;transition:.18s;
  background:linear-gradient(90deg,rgba(21,17,12,.93) 0%,rgba(21,17,12,.66) 42%,rgba(21,17,12,.5) 68%,rgba(21,17,12,.82) 100%)}
.loc:hover:not(.done):not([disabled]){border-color:var(--lamp);transform:translateY(-2px)}
.loc:hover:not(.done):not([disabled])::before{
  background:linear-gradient(90deg,rgba(21,17,12,.88) 0%,rgba(21,17,12,.5) 42%,rgba(21,17,12,.32) 68%,rgba(21,17,12,.7) 100%)}
.loc.done{opacity:.42;filter:saturate(.4)}
.loc[disabled]{opacity:.28;cursor:not-allowed}
.loc img{position:absolute;right:4px;bottom:0;height:84%;width:auto;z-index:1;pointer-events:none;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.75))}
.loc .who{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(17px,3.4vw,24px);letter-spacing:.06em;position:relative}
.loc .where{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dust);text-transform:uppercase;position:relative}
.loc .tag{position:absolute;top:10px;left:10px;z-index:2;background:rgba(21,17,12,.85);font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--lampdim);color:var(--lamp)}
.loc .tag.ok{border-color:#4d7a4f;color:#8fc194}
.maprow{width:100%;max-width:900px;display:flex;gap:10px}
.maprow .bigbtn{flex:1}
.note{flex:0 0 auto;border:2px solid #3a4630;background:#141a10;color:var(--dust);
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:0 18px;transition:.15s}
.note:hover{border-color:var(--lamp);color:var(--lamp)}
.note b{color:var(--lamp)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(6,8,4,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.bigbtn{width:100%;max-width:900px;background:var(--blood);color:var(--paper);font-family:var(--disp);
  text-transform:uppercase;font-weight:700;letter-spacing:.24em;font-size:17px;padding:16px;transition:.15s}
.bigbtn:hover:not([disabled]){filter:brightness(1.15)}
.bigbtn[disabled]{background:#3a3a33;color:#7d7a70;cursor:not-allowed}

/* ДИАЛОГ */
#talk{background:#0d1109;padding:0 0 clamp(12px,2.2vh,26px);justify-content:flex-end}
.stage{position:absolute;inset:0;overflow:hidden}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 26%,rgba(240,200,96,.10),transparent 62%),
             linear-gradient(transparent 52%,rgba(6,8,4,.78))}
.bg{position:absolute;inset:0;overflow:hidden;background-size:cover;background-position:center 46%;
  animation:drift 40s ease-in-out infinite alternate}
.stage[data-loc="seryoga"] .bg{background-image:url('bg/seryoga.webp')}
.stage[data-loc="misha"]   .bg{background-image:url('bg/misha.webp')}
.stage[data-loc="pasha"]   .bg{background-image:url('bg/pasha.webp')}
.stage[data-loc="senya"]   .bg{background-image:url('bg/senya.webp')}
.stage[data-loc="yagodki"] .bg{background:radial-gradient(ellipse at 60% 78%,#4a1f66,#150c1c 66%)}
.fig{position:absolute;bottom:0;height:88%;width:auto;z-index:1;
  transition:filter .25s,transform .25s;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.75))}
.fig.me{left:11%;transform:scaleX(1)}
.fig.you{right:11%;transform:scaleX(-1)}
.fig.dim{filter:brightness(.4) saturate(.55) drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.fig.trio{height:auto;width:min(58%,540px);left:50%;right:auto;bottom:34%;
  transform:translateX(-50%);animation:trioIn .55s ease-out}
@keyframes trioIn{from{opacity:0;transform:translateX(-50%) translateY(18px) scale(.94)}
  to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.box{position:relative;z-index:2;width:calc(100% - clamp(16px,4vw,48px));max-width:680px;margin:0 auto;
  background:rgba(16,12,8,.70);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  border:1px solid rgba(240,200,96,.22);box-shadow:0 10px 34px rgba(0,0,0,.55);
  padding:14px clamp(13px,2.4vw,20px) 15px;max-height:62vh;overflow-y:auto}
.spk{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.14em;
  font-size:14px;color:var(--lamp);margin-bottom:5px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.spk.me{color:#9fc4a4}
.line{font-size:clamp(14.5px,2.1vw,17px);line-height:1.5;color:var(--paper);min-height:1.6em;
  text-shadow:0 1px 3px rgba(0,0,0,.7)}
.line em{font-style:italic;color:var(--dust)}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.opt{border:1px solid rgba(240,200,96,.24);background:rgba(20,16,10,.72);padding:11px 13px;text-align:left;
  font-size:14px;line-height:1.38;color:#d3ccb8;transition:.13s;min-height:44px}
.opt:hover,.opt:focus-visible{border-color:var(--lamp);color:var(--paper);background:rgba(46,35,20,.85)}
.next{margin-top:12px;width:100%;border:1px solid rgba(240,200,96,.24);background:rgba(20,16,10,.6);padding:12px;font-family:var(--mono);
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dust)}
.next:hover{border-color:var(--lamp);color:var(--lamp)}
.gotkey{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:12;background:var(--lamp);color:var(--ink);font-family:var(--mono);font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;padding:9px 15px;opacity:0;pointer-events:none}
.gotkey.show{animation:pop 2.6s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

/* КАБИНЕТ — ДЕЛО */
#office{background:#0e120a}
.file{background:var(--paper);color:var(--ink);width:min(880px,100%);max-height:88vh;overflow:auto;
  padding:clamp(18px,3vw,30px);box-shadow:0 18px 50px rgba(0,0,0,.7)}
.file h2{font-family:var(--disp);text-transform:uppercase;font-weight:700;
  font-size:clamp(21px,4.2vw,34px);letter-spacing:.05em;line-height:1}
.file .st{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6b6555;margin-bottom:6px}
.rule{height:3px;background:var(--ink);margin:12px 0 18px}
.file p{font-size:14.5px;line-height:1.6;margin-bottom:.7em}
.susp{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:16px 0}
.card{border:2px solid var(--ink);background:#efe9d8;padding:9px;text-align:center;transition:.13s;position:relative}
.card:hover:not([disabled]){background:var(--ink);color:var(--paper)}
.card.sel{background:var(--blood);border-color:var(--blood);color:var(--paper)}
.card[disabled]{opacity:.35;cursor:not-allowed}
.card img{height:96px;width:auto;display:block;margin:0 auto 6px}
.card b{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:15px;display:block}
.card small{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#6b6555;text-transform:uppercase}
.card.sel small,.card:hover small{color:inherit;opacity:.75}
.card .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:64px;color:var(--blood);opacity:.75;pointer-events:none}
.ev{font-family:var(--mono);font-size:12px;line-height:1.9;letter-spacing:.02em;
  border-left:3px solid var(--blood);padding:8px 0 8px 14px;margin:14px 0}
.ev div::before{content:'— '}
.votes{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;border-top:1px dashed #9a927c;padding-top:12px;margin-top:6px}
.file .bigbtn{margin-top:18px}

/* БОЙ */
#fight{background:#080a06;padding:0}
#retry{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;
  background:rgba(6,8,4,.5);padding:20px}
#retry.on{display:flex}
#retry .box2{text-align:center}
#retry .lost{font-family:var(--mono);font-size:clamp(11px,2vw,13px);letter-spacing:.2em;
  text-transform:uppercase;color:#a09786;margin-bottom:20px}
#retry button{border:2px solid var(--blood);background:rgba(176,42,26,.2);color:var(--paper);
  font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.2em;
  font-size:clamp(15px,2.6vw,19px);padding:16px 32px;transition:.15s}
#retry button:hover{background:var(--blood)}
#fcv{display:block;width:100%;height:100%;touch-action:none}
.fhud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:6;
  display:flex;justify-content:center;gap:10px;font-family:var(--mono);font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--lamp);pointer-events:none}
.ftouch{position:fixed;inset:0;z-index:5;display:none;pointer-events:none;touch-action:none}
.ftouch.on{display:block}
#fstick{position:absolute;left:0;bottom:0;width:55%;height:70%;pointer-events:auto;touch-action:none}
#fknob{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  border:2px solid rgba(228,220,198,.26);background:rgba(10,13,7,.3);display:none}
#fknob.on{display:block}
#fknob i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;
  border-radius:50%;background:rgba(240,200,96,.5);border:2px solid var(--lamp)}
#ffire{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));
  width:104px;height:104px;border-radius:50%;border:2px solid var(--blood);background:rgba(160,36,24,.3);
  color:var(--paper);font-family:var(--disp);font-weight:700;letter-spacing:.1em;font-size:17px;
  display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#ffire:active{background:var(--blood)}

#cut{background:#070905;padding:0;justify-content:flex-end}
.cutblur{position:absolute;inset:0;background-size:cover;background-position:center;
  filter:blur(26px) brightness(.42);transform:scale(1.15)}
.cutimg{position:absolute;inset:0;background-size:contain;background-position:center 42%;
  background-repeat:no-repeat;animation:cutin 11s ease-out forwards}
@keyframes cutin{from{transform:scale(1.0)}to{transform:scale(1.035)}}
.cutveil{position:absolute;inset:0;background:linear-gradient(transparent 46%,rgba(7,9,5,.92) 82%)}
@media (max-width:760px){
  .cutimg{background-position:center 34%}
  .cutveil{background:linear-gradient(transparent 38%,rgba(7,9,5,.93) 74%)}
}
.cutbox{position:relative;z-index:2;width:calc(100% - clamp(16px,4vw,48px));max-width:700px;
  margin:0 auto clamp(18px,4vh,48px);text-align:center}
.cuttxt{font-size:clamp(15px,2.3vw,19px);line-height:1.6;color:var(--paper);
  text-shadow:0 2px 8px rgba(0,0,0,.9);margin-bottom:16px}
.cuttxt b{color:var(--lamp)}
.cutbtn{border:2px solid var(--lamp);color:var(--lamp);background:rgba(10,13,7,.55);
  font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.26em;
  font-size:16px;padding:14px 34px;transition:.15s}
.cutbtn:hover{background:var(--lamp);color:var(--ink)}
#credits{background:#0a0d07;padding:0;overflow:hidden;justify-content:flex-start}
#credits::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:url('bg/menu.webp');background-size:cover;background-position:center 60%;filter:blur(3px)}
.roll{position:absolute;left:0;right:0;top:100%;padding:0 20px 40vh;text-align:center;
  animation:roll 46s linear forwards}
@keyframes roll{to{transform:translateY(-100%)}}
.roll h3{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.2em;
  font-size:clamp(28px,6vw,54px);color:var(--blood);margin:0 0 6px}
.roll .sub{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--lampdim);margin-bottom:44px}
.roll .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;
  color:var(--lampdim);margin:38px 0 14px}
.roll .row{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  font-size:clamp(17px,3.4vw,25px);color:var(--paper);line-height:1.5}
.roll .row small{display:block;font-family:var(--body);font-weight:400;text-transform:none;
  letter-spacing:0;font-size:13px;color:var(--dust);margin-bottom:14px}
.roll .one{margin:0 0 34px}
.roll .one .frame{height:clamp(170px,32vw,240px);display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px}
.roll .one img{height:100%;width:auto;display:block;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.75))}
.roll .fin{font-family:var(--body);font-size:15px;line-height:1.7;color:#a9a292;max-width:520px;margin:0 auto}
#skip{position:fixed;right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:8;border:1px solid #3a4630;background:rgba(10,13,7,.8);padding:11px 18px;
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust)}
#skip:hover{border-color:var(--lamp);color:var(--lamp)}
#tally{background:#0b0d07;justify-content:flex-start}
#tally::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.2;
  background-image:url('bg/menu.webp');background-size:cover;background-position:center 55%;filter:blur(3px)}
#tally::after{content:'';position:absolute;inset:0;pointer-events:none;background:rgba(11,13,7,.86)}
.tallybox{position:relative;z-index:2;width:min(720px,100%);max-height:100%;overflow-y:auto;padding:6px 2px}
.tallybox h2{font-family:var(--disp);text-transform:uppercase;font-weight:700;letter-spacing:.08em;
  font-size:clamp(22px,4.6vw,40px);color:var(--paper);line-height:1}
.tallybox .sub{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:#5f5c54;margin:8px 0 22px}
.trow{border-top:1px solid #24261f;padding:15px 0;opacity:0;transform:translateY(8px);
  animation:trin .55s ease forwards}
@keyframes trin{to{opacity:1;transform:none}}
.trow .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:#5f5c54;margin-bottom:7px}
.trow .big{font-size:clamp(15px,2.3vw,18px);line-height:1.5;color:var(--paper)}
.trow .big b{color:var(--lamp);font-weight:700}
.trow .big i{font-style:normal;color:var(--blood);font-weight:700}
.trow .sm{font-size:13.5px;line-height:1.5;color:#8f8a78;margin-top:6px}
#tally .bigbtn{margin:26px 0 10px;opacity:0;animation:trin .5s ease forwards}
#reveal{background:#07090c;padding:0;justify-content:flex-end}
.revfig{position:absolute;left:50%;bottom:0;height:88%;width:auto;transform:translateX(-50%);
  filter:drop-shadow(0 12px 30px rgba(0,0,0,.85));transition:opacity .5s ease}
.revfig.out{opacity:0}
.revglow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 62%,rgba(240,200,96,.10),transparent 58%),
             linear-gradient(transparent 46%,rgba(7,9,12,.95))}
.revbox{position:relative;z-index:2;width:calc(100% - clamp(16px,4vw,48px));max-width:640px;
  margin:0 auto clamp(16px,4vh,44px);
  background:rgba(10,12,8,.76);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  border:1px solid rgba(240,200,96,.2);padding:15px clamp(13px,2.4vw,20px) 16px}
.revwho{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.15em;
  font-size:14px;color:var(--lamp);margin-bottom:6px}
.revwho.andrey{color:var(--blood)}
.revtxt{font-size:clamp(14.5px,2.1vw,17.5px);line-height:1.52;color:var(--paper);min-height:3.2em;
  text-shadow:0 1px 3px rgba(0,0,0,.75)}
.revnext{margin-top:13px;width:100%;border:1px solid rgba(240,200,96,.24);background:rgba(20,16,10,.6);
  padding:12px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dust)}
.revnext:hover{border-color:var(--lamp);color:var(--lamp)}
#sting{background:#000;justify-content:center}
.sting{max-width:760px;text-align:center;padding:0 18px}
.sting .cast{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  font-size:clamp(19px,3.8vw,32px);color:#fff6de;line-height:1.5;
  text-shadow:0 0 26px rgba(255,246,222,.22);
  opacity:0;animation:st 1.8s ease 0.8s forwards}
.sting .who{font-family:var(--mono);font-size:clamp(12px,2vw,15px);letter-spacing:.42em;
  text-transform:uppercase;color:#b3aa96;margin:26px 0 6px;
  opacity:0;animation:st 1.8s ease 3.6s forwards}
.sting .will{font-family:var(--mono);font-size:clamp(12px,2vw,15px);letter-spacing:.42em;
  text-transform:uppercase;color:#b3aa96;margin:0 0 20px;
  opacity:0;animation:st 1.8s ease 5.0s forwards}
.sting .film{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  font-size:clamp(38px,9.5vw,96px);color:#e0402c;line-height:.94;
  text-shadow:0 0 70px rgba(224,64,44,.55),0 2px 0 rgba(0,0,0,.6);
  opacity:0;animation:st 2.2s ease 7.0s forwards}
.sting .exc{font-family:var(--body);font-size:clamp(16px,2.6vw,21px);color:#e6dcc4;margin-top:34px;
  opacity:0;animation:st 1.8s ease 10.4s forwards}
.sting .lol{font-family:var(--disp);font-weight:700;font-size:clamp(26px,5vw,44px);letter-spacing:.22em;
  color:#f0c860;text-shadow:0 0 34px rgba(240,200,96,.35);
  margin-top:38px;opacity:0;animation:st 1.8s ease 13.0s forwards}
@keyframes st{to{opacity:1}}
#sting .bigbtn{max-width:320px;margin:44px auto 0;opacity:0;animation:st 1.4s ease 15.4s forwards;
  background:transparent;border:2px solid #55524a;color:#b3aa96}
#end .file{background:#12160f;color:var(--paper);border:2px solid #2c3623}
#end .file h2{color:var(--blood)}
#end .file .rule{background:var(--blood)}
#end .file p{color:#c3bda8}
#end .bigbtn{background:transparent;border:2px solid var(--blood);color:var(--blood)}
#mute{position:fixed;z-index:30;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  background:rgba(14,18,10,.75);border:1px solid #2c3623;color:var(--dust);font-size:15px}
#mute.off{color:#4a4a40}
@media (max-width:700px){
  .plot{grid-template-columns:1fr}
  .loc{min-height:74px;padding:10px}
  .loc img{height:96%}
  .fig{height:60%}
  .fig.me{left:-1%} .fig.you{right:-1%}
  .fig.trio{width:min(88%,360px);bottom:44%}
  .box{max-height:52vh;padding:12px 12px 13px}
  .opt{font-size:13.5px;padding:10px 12px;min-height:42px}
  .line{font-size:14px;line-height:1.45}
  .file{max-height:92vh}
  .card img{height:72px}
  .susp{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:400px),(max-height:620px){
  .fig{height:48%}
  .fig.trio{width:94%;bottom:47%}
  .opt{font-size:12.5px;padding:6px 10px;min-height:34px;line-height:1.3}
  .opts{gap:5px;margin-top:8px}
  .line{font-size:13px;line-height:1.38;min-height:1.2em}
  .spk{font-size:11.5px;margin-bottom:3px}
  .box{max-height:62vh;padding:9px 10px 10px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="scr on" id="menu">
  <h1 class="tt"><span class="b">Дело</span><span class="r">о бумаге</span><span class="s">27 июня · дача · шесть соток</span></h1>
  <button class="tape" id="btn-start">Начать</button>
</div>
<div class="scr" id="intro">
  <div id="prelude"></div>
  <div class="iw" id="introtext"></div>
  <div id="outro">
    <img id="outroimg" src="bg/standoff.webp" alt="">
    <button class="go" id="introgo">Начать расследование</button>
  </div>
</div>
<div class="scr" id="map">
  <div class="mhead"><div class="mday" id="mday"></div><div class="msub" id="msub"></div></div>
  <div class="plot" id="plot"></div>
  <div class="maprow">
    <button class="note" id="btn-note">Блокнот <b id="notecount">0</b></button>
    <button class="bigbtn" id="btn-office">В кабинет</button>
  </div>
</div>
<div class="scr" id="talk">
  <div class="stage" id="stage"><div class="bg"></div><img class="fig me" id="fig-me" alt=""><img class="fig you" id="fig-you" alt=""></div>
  <div class="box">
    <div class="spk" id="spk"></div>
    <div class="line" id="line"></div>
    <div class="opts" id="opts"></div>
  </div>
</div>
<div class="gotkey" id="gotkey"></div>
<div class="scr" id="office"><div class="file" id="officefile"></div></div>
<div class="scr" id="fight">
  <canvas id="fcv"></canvas>
  <div class="fhud" id="fhud"></div>
  <div id="retry"><div class="box2">
    <div class="lost" id="retry-why"></div>
    <button id="retry-go">Начать бой сначала</button>
  </div></div>
  <div class="ftouch" id="ftouch">
    <div id="fstick"><div id="fknob"><i></i></div></div>
    <div id="ffire">ОГОНЬ</div>
  </div>
</div>
<div class="scr" id="end"><div class="file" id="endfile"></div></div>
<div class="scr" id="cut">
  <div class="cutblur" id="cutblur"></div><div class="cutimg" id="cutimg"></div><div class="cutveil"></div>
  <div class="cutbox"><div class="cuttxt" id="cuttxt"></div><button class="cutbtn" id="cutbtn"></button></div>
</div>
<div class="scr" id="reveal">
  <img class="revfig" id="revfig" alt=""><div class="revglow"></div>
  <div class="revbox"><div class="revwho" id="revwho"></div><div class="revtxt" id="revtxt"></div>
    <button class="revnext" id="revnext"></button></div>
</div>
<div class="scr" id="tally"><div class="tallybox" id="tallybox"></div></div>
<div class="scr" id="sting"><div class="sting" id="stingbox"></div></div>
<div class="scr" id="credits"><div class="roll" id="roll"></div><button id="skip">В меню</button></div>
<button id="mute" aria-label="Звук">♪</button>

let muted=false, AC=null, MASTER=null;
const ac=()=>(AC||=new (window.AudioContext||window.webkitAudioContext)());
function bus(){const c=ac(); if(!MASTER){MASTER=c.createGain();MASTER.gain.value=muted?0:1;MASTER.connect(c.destination);} return MASTER;}
$('#mute').onclick=()=>{muted=!muted;$('#mute').classList.toggle('off',muted);$('#mute').textContent=muted?'✕':'♪';
  try{bus().gain.value=muted?0:1;}catch(e){} Object.values(SND).forEach(a=>{if(a)a.muted=muted;}); haptic('light');};
function blip(f,d,t,v){try{const c=ac(),t0=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.type=t||'square';o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v||.05,t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+(d||.08));o.connect(g);g.connect(bus());o.start(t0);o.stop(t0+(d||.08)+.03);}catch(e){}}

function noise(dur,vol,lp,hp){
  try{const c=ac(),n=Math.floor(c.sampleRate*dur),bf=c.createBuffer(1,n,c.sampleRate),d=bf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const src=c.createBufferSource(); src.buffer=bf;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||3000;
    const g=c.createGain(); g.gain.value=vol||.08;
    src.connect(f);
    if(hp){const hf=c.createBiquadFilter();hf.type='highpass';hf.frequency.value=hp;f.connect(hf);hf.connect(g);}
    else f.connect(g);
    g.connect(bus()); src.start();}catch(e){}
}
function sfxStamp(){
  try{const c=ac(),t=c.currentTime;
    noise(.05,.10,5200,900);
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(64,t+.13);
    g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.17);
    o.connect(g); g.connect(bus()); o.start(t); o.stop(t+.2);
  }catch(e){}
  haptic('medium');
}
function sfxThud(){
  try{const c=ac(),t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(28,t+.75);
    g.gain.setValueAtTime(.30,t); g.gain.exponentialRampToValueAtTime(.0001,t+.95);
    o.connect(g); g.connect(bus()); o.start(t); o.stop(t+1);
    noise(.5,.05,340);
  }catch(e){}
  haptic('heavy');
}

let MUSIC=null;
function music(name){
  stopMusic();
  const play1=(f,fallback)=>{
    const a=sfile(f); a.loop=true; a.currentTime=0; a.volume=0.85;
    let done=false;
    const fall=()=>{ if(done||!fallback) return; done=true; play1(fallback,null); };
    a.onerror=fall;                                  // откат только если файла нет
    a.play().catch(()=>{});                          // прерванный запуск откатом не считаем
    setTimeout(()=>{ if(a.error) fall(); }, 900);
    MUSIC=a;
  };
  play1(name, name==='fight' ? null : 'fight');
}

function runIntro(){
  show('intro'); stopMusic();
  const b=$('#introtext'); b.innerHTML='';
  b.style.opacity='0'; $('#outro').classList.remove('on'); $('#introgo').classList.remove('on');
  setTimeout(()=>{ b.style.opacity='1'; music('music-intro'); }, 5200);   // музыка вместе с ползунком
  // стартовую и конечную позицию считаем под конкретный экран:
  // из-за наклона и переносов строк высота блока везде разная
  const fit=()=>{
    const H=$('#intro').getBoundingClientRect().height || window.innerHeight;
    const anim=b.style.animation; b.style.animation='none'; const op=b.style.opacity; b.style.opacity='0';
    const seen=v=>{ b.style.top=v+'%';
      return [...b.children].some(p=>{const r=p.getBoundingClientRect(); return r.bottom>0 && r.top<window.innerHeight;}); };
    let lo=50, hi=1400;
    if(seen(hi)) { b.style.top=''; b.style.animation=anim; b.style.opacity=op; return; }
    for(let k=0;k<14;k++){ const mid=(lo+hi)/2; if(seen(mid)) lo=mid; else hi=mid; }
    const startTop = hi + 0.5;
    const blockPct = b.getBoundingClientRect().height / H * 100;
    b.style.setProperty('--from', startTop.toFixed(1)+'%');
    b.style.setProperty('--to', (-(blockPct+60)).toFixed(1)+'%');
    b.style.top=''; b.style.animation=anim; b.style.opacity=op;
  };
  const pre=$('#prelude');
  pre.innerHTML = INTRO[0].t;
  pre.style.animation='none'; void pre.offsetWidth; pre.style.animation='';
  INTRO.slice(1).forEach(l=>{const p=document.createElement('p');if(l.s)p.className='st';p.innerHTML=l.t;b.appendChild(p);});
  fit();                                  // считаем позиции уже по готовому блоку
  b.style.animation='none'; void b.offsetWidth; b.style.animation='';
  const g=$('#introgo');
  g.onclick=()=>{stopMusic(); startGame();};
  const last=b.lastElementChild;
  let done=false;
  const finish=()=>{
    if(done) return; done=true;
    b.style.animationPlayState='paused';
    b.style.opacity='0';
    $('#outro').classList.add('on');
    setTimeout(()=>g.classList.add('on'), 1400);
  };
  const watch=()=>{
    if(done || !$('#intro').classList.contains('on')) return;
    if(last.getBoundingClientRect().bottom <= 0){ finish(); return; }   // весь текст ушёл вверх
    requestAnimationFrame(watch);
  };
  requestAnimationFrame(watch);
  b.addEventListener('animationend', finish, {once:true});
}

function startBabki(){ TRIES=0; BABKI={wave:0, left:0, phase:1}; BOSS=null; startFight(); }
function babkiWave(){
  BABKI.wave++;
  const last = BABKI.phase===2;
  const n = last ? 10 : ([0,5,7,9][BABKI.wave] || 9);
  const hp = last ? 3 : ([0,2,3,4][BABKI.wave] || 4);
  const sp = last ? 120 : ([0,94,110,128][BABKI.wave] || 128);
  if(!F.spawnPts){
    const pts=[];
    for(let y=30;y<H-30;y+=26) for(let x=30;x<W-30;x+=26){
      if(solid(x,y)) continue;
      if(Math.hypot(x-KOL.x,y-KOL.y) < 300) continue;   // не в упор к колонке
      pts.push({x,y});
    }
    F.spawnPts = pts;
  }
  F.foes = [];
  const pts=F.spawnPts;
  for(let i=0;i<n && pts.length;i++){
    const q = pts[rnd(pts.length)];
    F.foes.push({id:100+i,x:q.x,y:q.y,hp,max:hp,spd:sp+Math.random()*18,cd:99,mode:'babka',t:0,nm:'',babka:true,
                 sw:Math.random()*6.28});
  }
  F.foes.forEach(f=>f.img = rnd(2));
  BABKI.left = n;
  F.waveTip = 2.6;
  F.banner = last ? 'ВОЛНА 4 ИЛИ ПОЛНЫЙ ПИЗДЕЦ' : ('ВОЛНА '+BABKI.wave);
  F.bannerT = 2.4;
}

function steer(f, tx, ty, dt, speed){
  const ang=Math.atan2(ty-f.y, tx-f.x), st=speed*dt;
  if(f._px===undefined){ f._px=f.x; f._py=f.y; f._t=0; }
  if(f.detourT>0){
    f.detourT-=dt;
    const a=ang+f.detourSide*1.5, mx=Math.cos(a)*st, my=Math.sin(a)*st;
    if(!solid(f.x+mx,f.y)) f.x+=mx;
    if(!solid(f.x,f.y+my)) f.y+=my;
    return;
  }
  const mx=Math.cos(ang)*st, my=Math.sin(ang)*st;
  if(!solid(f.x+mx,f.y)) f.x+=mx;
  else if(!solid(f.x,f.y+Math.sign(my||1)*st)) f.y+=Math.sign(my||1)*st;
  if(!solid(f.x,f.y+my)) f.y+=my;
  else if(!solid(f.x+Math.sign(mx||1)*st,f.y)) f.x+=Math.sign(mx||1)*st;
  f._t+=dt;
  if(f._t>0.45){
    if(Math.hypot(f.x-f._px,f.y-f._py) < speed*0.45*0.35){   // почти не сдвинулся — упёрся
      if(!f.detourT) f.detourSide = Math.random()<0.5 ? 1 : -1;
      f.detourT = 0.9 + Math.random()*0.7;
      const bx=f.x-mx*2, by=f.y-my*2;                        // шаг назад
      if(!solid(bx,by)){ f.x=bx; f.y=by; }
    }
    f._px=f.x; f._py=f.y; f._t=0;
  }
}

function solid(x,y){
  for(const w of WALLS) if(x>w.x-10&&x<w.x+w.w+10&&y>w.y-10&&y<w.y+w.h+10) return true;
  return x<12||y<12||x>W-12||y>H-12;
}
function los(a,b){ const st=Math.hypot(b.x-a.x,b.y-a.y)/12;
  for(let i=1;i<st;i++){const t=i/st; if(solid(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t)) return false;} return true; }

function floop(now){
  if(!F)return;

  if(!F.over) fstep(dt); else F.over-=dt;
  fdraw();

    const allDead=F.foes.every(f=>f.hp<=0);
    if(!F.me.alive) DIED++;

      if(F.kolDead){ stopMusic(); return showRetry('Колонку разобрали на части.'); }
      if(!F.me.alive){ stopMusic(); return showRetry('До тебя добрались.'); }
      if(BABKI.phase===0){ F=null; stopMusic(); return babkiRocket(); }   // три волны позади
      if(BABKI.phase===2){ BABKI=null; S.kolSaved=true; F=null; stopMusic(); return afterBabki(true,false); }
      if(allDead){ BABKI=null; S.kolSaved=true; F=null; stopMusic(); return afterBabki(true, false); }
      startFight(); return;
    }
    if(BOSS){
      if(!F.me.alive){ stopMusic(); return showRetry('Тебя уложили.'); }
      if(allDead){
        if(BOSS.stage===1){ const id=BOSS.id; F=null; stopMusic(); return stage2(id); }
        BOSS=null; F=null; stopMusic(); return afterBoss(true);
      }
      startFight(); return;
    }
    if(!F.me.alive){ stopMusic(); return showRetry('Ягодки тебя достали.'); }
    if(allDead){
      if(YAG===1){ F=null; stopMusic(); return yagStage2(); }
      return fightWin();
    }
    startFight(); return;
  }
  requestAnimationFrame(floop);
}
function fstep(dt){
  const me=F.me;
  let dx,dy;
  if(F.stick.on){dx=F.stick.x;dy=F.stick.y;}
  else{dx=(F.keys.right?1:0)-(F.keys.left?1:0);dy=(F.keys.down?1:0)-(F.keys.up?1:0);
       const l=Math.hypot(dx,dy); if(l>1){dx/=l;dy/=l;}}
  const sp=(F.mower?290:210)*dt;
  if(!solid(me.x+dx*sp,me.y)) me.x+=dx*sp;
  if(!solid(me.x,me.y+dy*sp)) me.y+=dy*sp;
  // прицел
  const live=F.foes.filter(f=>f.hp>0&&!f.hidden);
  if(COARSE){ let best=null,bd=1e9;
    live.forEach(f=>{const d=Math.hypot(f.x-me.x,f.y-me.y); if(d<bd){bd=d;best=f;}});
    if(best) me.ang=Math.atan2(best.y-me.y,best.x-me.x);
    else if(dx||dy) me.ang=Math.atan2(dy,dx);
  } else me.ang=Math.atan2(F.mouse.y-me.y,F.mouse.x-me.x);
  me.cd-=dt;
  if(F.fire&&me.cd<=0){
    if(F.rocket){
      me.cd=.42;
      F.bullets.push({x:me.x+Math.cos(me.ang)*18,y:me.y+Math.sin(me.ang)*18,
        vx:Math.cos(me.ang)*520,vy:Math.sin(me.ang)*520,mine:true,rocket:true});
      blip(240,.14,'sawtooth',.07); F.shake=6;
    } else if(F.mower){
      me.cd=.065;
      const sp2=(Math.random()-0.5)*0.06;
      F.bullets.push({x:me.x+Math.cos(me.ang)*24,y:me.y+Math.sin(me.ang)*24,
        vx:Math.cos(me.ang+sp2)*760,vy:Math.sin(me.ang+sp2)*760,mine:true});
      blip(1050,.04,'square',.045); F.shake=2.5;
    } else {
      me.cd=.11;
      F.bullets.push({x:me.x+Math.cos(me.ang)*18,y:me.y+Math.sin(me.ang)*18,
        vx:Math.cos(me.ang)*640,vy:Math.sin(me.ang)*640,mine:true});
      blip(900,.05,'square',.05); F.shake=3;
    }
  }
  // ИИ
  const aliveN = F.foes.filter(f=>f.hp>0).length;
  const DUAL = !BOSS && aliveN<=2, NADES = !BOSS && aliveN<=1;
  F.foes.forEach(f=>{
    if(f.hp<=0)return;
    if(f.babka){
      const K=F.kol;
      const ang=Math.atan2(K.y-f.y,K.x-f.x);
      const dk=Math.hypot(K.x-f.x,K.y-f.y);
      const d=Math.hypot(me.x-f.x,me.y-f.y);
      f.sw+=dt*7;
      if(dk<40){                                  // дорвалась до колонки
        K.hp-=dt*(BABKI.phase===2?4.5:9); K.flash=.12; f.hitting=true;
        if(d<26 && me.alive){ me.alive=false; F.over=1.4; haptic('error'); }
        return;
      }

      steer(f, K.x, K.y, dt, f.spd);
      if(solid(f.x,f.y) && F.spawnPts && F.spawnPts.length){
        const q=F.spawnPts[rnd(F.spawnPts.length)]; f.x=q.x; f.y=q.y;
      }
      return;
    }
    f.dual=DUAL; f.nades=NADES;
    f.t-=dt; f.cd-=dt; f.ncd=(f.ncd||0)-dt;
    const ang=Math.atan2(me.y-f.y,me.x-f.x), d=Math.hypot(me.x-f.x,me.y-f.y);
    let mx=Math.cos(ang),my=Math.sin(ang);
    if(f.mode==='flank'){ mx=Math.cos(ang+.9); my=Math.sin(ang+.9); }
    const seen = los(f,me);
    if(seen && d<170 && f.mode!=='rush'){ mx*=-.5; my*=-.5; }
    else if(!seen){ f.detourT = f.detourT || 0; }   // не видит — идёт вплотную, обход разрулит steer
    steer(f, f.x+mx*120, f.y+my*120, dt, f.spd);
    if(f.cd<=0&&los(f,me)&&d<520){
      f.cd=(f.mode==='rush'?1.15:(f.mode==='flank'?1.5:1.35))*(DUAL?0.5:1);
      if(f.monster){
        f.cd=0.95;
        for(let a=-2;a<=2;a++) F.bullets.push({x:f.x+Math.cos(ang+a*0.22)*30,y:f.y+Math.sin(ang+a*0.22)*30,
          vx:Math.cos(ang+a*0.22)*300,vy:Math.sin(ang+a*0.22)*300,mine:false,kind:null});
        return;
      }
      const sp = BOSS?330:420;
      const pk = f.proj || (BOSS?BOSS.proj:null);
      const shot=(off)=>F.bullets.push({x:f.x+Math.cos(ang+off)*16,y:f.y+Math.sin(ang+off)*16,
        vx:Math.cos(ang+off)*sp,vy:Math.sin(ang+off)*sp,mine:false,
        kind:pk, ang:ang+off, sp:0});
      if(DUAL){ shot(-0.10); shot(0.10); } else shot(0);
    }
    if(NADES&&f.ncd<=0&&d<560){ f.ncd=2.6;
      F.nades.push({x:f.x,y:f.y,tx:me.x,ty:me.y,t:0,dur:1.25,sx:f.x,sy:f.y});
      blip(220,.12,'triangle',.05); }
  });
  // гранаты
  F.nades=F.nades.filter(g=>{ g.t+=dt;
    const k=Math.min(1,g.t/g.dur);
    g.x=g.sx+(g.tx-g.sx)*k; g.y=g.sy+(g.ty-g.sy)*k;
    if(k>=1){ F.booms.push({x:g.x,y:g.y,t:0});
      if(Math.hypot(me.x-g.x,me.y-g.y)<74&&me.alive){ me.alive=false; F.over=(BOSS||BABKI)?1.0:1.4; haptic('error'); }
      F.shake=14; blip(70,.35,'sawtooth',.09); return false; }
    return true; });
  F.booms=F.booms.filter(b=>{ b.t+=dt; return b.t<.45; });
  // пули
  F.bullets=F.bullets.filter(b=>{
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(solid(b.x,b.y)) return false;
    if(b.mine&&b.rocket){
      let boom=solid(b.x,b.y);
      for(const f of F.foes) if(f.hp>0&&Math.hypot(f.x-b.x,f.y-b.y)<20){ boom=true; break; }
      if(boom){
        F.booms.push({x:b.x,y:b.y,t:0});
        for(const f of F.foes) if(f.hp>0&&Math.hypot(f.x-b.x,f.y-b.y)<86) f.hp=0;
        blip(70,.34,'sawtooth',.10); F.shake=16; haptic('heavy');
        return false;
      }
      return true;
    }
    if(b.mine){ for(const f of F.foes){ if(f.hp>0&&Math.hypot(f.x-b.x,f.y-b.y)<(f.monster?46:19)){
      f.hp--; f.flash=.12;
      if(f.hp<=0){
        blip(150,.28,'sawtooth',.08); haptic('medium'); F.shake=10;
        play(f.die);
        if(F.foes.every(x=>x.hp<=0)) setTimeout(()=>play('yagodka-4'),1500);
      } else {
        F.shake=4;
        blip(520,.05,'square',.045);        /* без криков, только глухой удар */
      }
      return false; } } }
    else if(Math.hypot(me.x-b.x,me.y-b.y)<(F.mower?22:15)){
      if(F.mower && F.mowHP>1){ F.mowHP--; F.mowHit=0.35; blip(200,.16,'sawtooth',.07); haptic('medium'); F.shake=10; return false; }
      me.alive=false; F.over=(BOSS||BABKI)?1.0:1.4; haptic('error'); F.shake=12; return false; }
    return true;
  });
  if(BABKI){
    if(F.waveTip>0) F.waveTip-=dt;
    if(F.kol && F.kol.hp<=0 && !F.kolDead){        // проверяем всегда, а не только когда рядом стоят
      F.kol.hp=0; F.kolDead=true; F.over=1.2; haptic('error'); F.shake=16;
    }
    if(BABKI.phase===2){
      F.hold = Math.max(0, (F.hold||0) - dt);
      if(F.spawnT===undefined) F.spawnT=0;
      F.spawnT-=dt;
      if(F.spawnT<=0 && F.foes.filter(f=>f.hp>0).length<22){   // подсыпаем со всех сторон
        F.spawnT=1.4; babkiTop();
      }
      if(F.hold<=0 && !F.over){ F.over=1.8; }
    }
    else if(F.foes.every(f=>f.hp<=0) && !F.over){
      if(BABKI.wave<3) babkiWave();
      else { BABKI.phase=0; F.over=1.2; }        // третья зачищена — уходим на кадр
    }
    if(F.bannerT>0) F.bannerT-=dt;
  } else if(F.foes.every(f=>f.hp<=0)&&!F.over){ F.over=1.6; }
  if(F.shake>0) F.shake=Math.max(0,F.shake-dt*30);
  if(F.yell>0) F.yell-=dt;
}
function drawBar(f){

function fdraw(){
  const d=Math.min(devicePixelRatio||1,2), VW=fcv.width/d, VH=fcv.height/d;
  const sc=Math.min(VW/W,VH/H), ox=(VW-W*sc)/2, oy=(VH-H*sc)/2;
  const sh=F.shake?(Math.random()-.5)*F.shake:0;
  fx.setTransform(d,0,0,d,0,0); fx.fillStyle='#080a06'; fx.fillRect(0,0,VW,VH);
  fx.setTransform(sc*d,0,0,sc*d,(ox+sh)*d,(oy+sh*.6)*d);
  if(ARENA_IMG.complete && ARENA_IMG.naturalHeight) fx.drawImage(ARENA_IMG,0,0,W,H);
  else { fx.fillStyle='#26301c'; fx.fillRect(0,0,W,H); }
  fx.font='700 10px "Courier New",monospace'; fx.textAlign='center';
  WALLS.forEach(w=>{
    // тень на землю
    fx.fillStyle='rgba(0,0,0,.42)'; fx.fillRect(w.x+7,w.y+9,w.w,w.h);
    // крыша досками
    fx.fillStyle='#4b3b28'; fx.fillRect(w.x,w.y,w.w,w.h);
    const horiz = w.w>=w.h;
    fx.strokeStyle='rgba(0,0,0,.28)'; fx.lineWidth=1.5; fx.beginPath();
    if(horiz){ for(let y=w.y+9;y<w.y+w.h;y+=9){ fx.moveTo(w.x,y); fx.lineTo(w.x+w.w,y); } }
    else { for(let x=w.x+9;x<w.x+w.w;x+=9){ fx.moveTo(x,w.y); fx.lineTo(x,w.y+w.h); } }
    fx.stroke();
    // конёк
    fx.strokeStyle='rgba(228,220,198,.16)'; fx.lineWidth=3; fx.beginPath();
    if(horiz){ fx.moveTo(w.x+4,w.y+w.h/2); fx.lineTo(w.x+w.w-4,w.y+w.h/2); }
    else { fx.moveTo(w.x+w.w/2,w.y+4); fx.lineTo(w.x+w.w/2,w.y+w.h-4); }
    fx.stroke();

    '<p>Три ягоды лежали на дорожке между сортиром и теплицей. Пиджак лежал отдельно, пустой, застёгнутый на все пуговицы.</p>'+
    '<p>Сеня к тому моменту уже нихуя не объяснял. Он вообще стал заметно тише — как человек, из которого вынули то, что говорило за него последние двенадцать лет.</p>'+
    '<p>Табличку «БУМАГУ НЕ БРОСАТЬ» Даня повесил заново. Третью по счёту. Больше её, блядь, никто не снимал — на участке к тому моменту почти не осталось желающих.</p>'+

/* ── ИТОГИ. проценты фиксированные, чтобы при перепрохождении не плясали ── */
const PCT_JAIL = {seryoga:41, misha:37, pasha:22, senya:12};
const plural=(k,one,few,many)=>{const a=k%10,b=k%100;
  return (a===1&&b!==11)?one : (a>=2&&a<=4&&(b<12||b>14))?few : many;};
function showTally(){

  const ev=evidence().length;
  const rows=[];

  rows.push(['Потери', gone.length===0
      ? 'Ты не потерял никого. Так вышло у <i>4%</i>.'
    : gone.length===1
      ? 'Из-за тебя и ещё <i>58%</i> таких же следователей мы потеряли <b>'+CAST[gone[0]].acc+'</b>, блять.'
      : 'Из-за тебя и ещё <i>74%</i> таких же следователей мы потеряли <b>'+CAST[gone[0]].acc+'</b> и <b>'+CAST[gone[1]].acc+'</b>, блять.',
    gone.length===0 ? 'Либо ты гений, либо просто везучий мудак.'
      : gone.length===1 ? 'Он приезжал сюда двенадцать лет подряд. Каждый год. На электричке.'
      : 'Они приезжали сюда двенадцать лет подряд. Каждый год. На электричке.']);

  rows.push(['Манеры', S.mishaRude
    ? 'Ты нахамил Мише. Как и <i>73%</i>.'
    : 'Ты вёл себя как человек. Таких <i>27%</i>.',
    S.mishaRude ? 'Он потом молчал два дня и оказался прав вообще во всём. Поздравляю.'
      : 'Миша это запомнил. Это единственная причина, по которой ты дожил до третьего дня.']);

  rows.push(['Смерти', DIED===0
      ? 'Ты не сдох ни разу. Так прошли <i>6%</i>.'
      : 'Ты сдох <b>'+DIED+'</b> '+plural(DIED,'раз','раза','раз')+'. Больше, чем <i>68%</i> игроков.',
    DIED===0 ? 'Либо у тебя руки, либо ты закрыл вкладку и вернулся.'
      : DIED>8 ? 'В основном от бабок. Они старые, но быстрые.'
      : 'Могло быть хуже. У большинства и было.']);

  if(S.kolSaved || S.kolLost)
    rows.push(['Колонка', S.kolSaved
      ? 'Колонку ты отстоял. Справились <i>19%</i>.'
      : 'Колонку разобрали у тебя на глазах. Как и у <i>81%</i>.',
      S.kolSaved ? 'Бабки разошлись по домам и внесли тебя в список.'
        : 'Зато в ту ночь весь посёлок наконец выспался.']);

  rows.push(['Блокнот', S.noteOpened
    ? 'Ты хотя бы открывал блокнот. Таких <i>56%</i>.'
    : 'Ты ни разу не открыл блокнот. Как и <i>44%</i>.',
    S.noteOpened ? 'Он там, между прочим, всё это время лежал и всё считал.'
      : 'Он лежал в кармане всю игру. Там было написано, кто это сделал.']);

  if(S.solved && (S.evAtEnd||0)<3)
    rows.push(['Доказательства', 'Ты посадил его, имея на руках <b>'+(S.evAtEnd||0)+'</b> из восьми показаний. Так делают <i>17%</i>.',
      'То есть угадал. Поздравляю, конечно, но давай мы оба будем помнить, как это было.']);
  if(S.saved)
    rows.push(['Спасённый', 'Ты вычислил следующего и успел его предупредить. Так вышло у <i>9%</i>.',
      CAST[S.saved].n+' провёл ночь на ведре в сортире и до сих пор считает, что ты перегнул.']);
  rows.push(['Итог', S.solved
    ? 'Дело раскрыто. Как и у <i>31%</i>.'
    : 'Дело закрыто по причине смерти следователя. Как и у <i>69%</i>.',
    S.solved ? 'Остальные до сих пор думают, что это был Миша.'
      : 'Табличку «БУМАГУ НЕ БРОСАТЬ» так никто и не повесил.']);

  $('#tallybox').innerHTML =
    '<h2>Чем всё кончилось</h2>'+
    '<div class="sub">данные собраны с шести соток · погрешность плюс-минус всё</div>'+
    rows.map(([cap,big,sm],i)=>
      '<div class="trow" style="animation-delay:'+(i*0.35+0.2).toFixed(2)+'s">'+
        '<div class="cap">'+cap+'</div><div class="big">'+big+'</div><div class="sm">'+sm+'</div></div>').join('')+
    '<button class="bigbtn" id="tally-ok" style="animation-delay:'+(rows.length*0.35+0.5).toFixed(2)+'s">Продолжить</button>';
  show('tally');
  $('#tallybox').scrollTop=0;
  $('#tally-ok').onclick=revealScene;
}

function revealScene(){
  stopVO(); stopMusic();
  let i=0;
  const hasAndrey = !!ART.andrey_portrait;
  let unmasked=false;
  const step=()=>{
    if(i>=REVEAL.length){ rollCredits(); return; }
    const L=REVEAL[i++];
    const fig=$('#revfig');
    if(L.andrey && !unmasked){
      unmasked=true;
      fig.classList.add('out');
      setTimeout(()=>{ fig.src = hasAndrey ? ART.andrey_portrait : ART.pasha_portrait;
        fig.style.filter = hasAndrey ? '' : 'brightness(.25) contrast(1.6)';
        fig.classList.remove('out'); }, 380);
    } else if(unmasked){
      fig.src = hasAndrey ? ART.andrey_portrait : ART.pasha_portrait;
      fig.style.filter = hasAndrey ? '' : 'brightness(.25) contrast(1.6)';
      fig.classList.remove('out');
    } else {
      fig.src = ART.pasha_portrait; fig.style.filter=''; fig.classList.remove('out');
    }
    $('#revwho').className = 'revwho'+(unmasked?' andrey':'');
    $('#revwho').textContent = L.w;
    $('#revtxt').innerHTML = L.t;
    if(L.v) play(L.v);
    $('#revnext').textContent = i>=REVEAL.length ? 'Титры' : 'Дальше';
  };
  $('#revnext').onclick=step;
  show('reveal');
  step();
}

/* сцена после титров */
function sting(){
  const dead = [S.dead, S.dead2].filter(Boolean);
  const gone = dead.map(id=>CAST[id].gen);
  if(S.danyaDead) gone.push('Дани');
  const alive = (S.danyaDead?[]:['Даня Участков'])
    .concat(ORDER.filter(id=>!dead.includes(id)).map(id=>CAST[id].n+' '+CAST[id].s));
  const list = a => a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' и '+a[a.length-1];
  const exc = gone.length ? 'кроме '+list(gone) : 'все до одного. это, если честно, подозрительно';
  $('#stingbox').innerHTML =
    '<div class="cast">'+(alive.length?alive.join('<br>'):'НИКТО')+'</div>'+
    '<div class="who">вернутся</div>'+
    '<div class="will">в фильме</div>'+
    '<div class="film">Месители<br>Финал</div>'+
    '<div class="exc">'+exc+'</div>'+
    '<div class="lol">лол</div>'+
    '<button class="bigbtn" id="sting-ok">В меню</button>';
  music('music-sting');
  show('sting');
  $('#sting-ok').onclick=()=>location.reload();
}
